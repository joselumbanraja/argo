name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/joselumbanraja/webapp   # huruf kecil semua

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Update tag di repo GitOps
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/joselumbanraja/webapp-gitops.git
          cd webapp-gitops
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" webapp/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "deploy webapp ${{ github.sha }}"
          git push