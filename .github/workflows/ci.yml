name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
  pull_request:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/joselumbanraja/webapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./... -v

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  update-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tag image di k8s/
        run: |
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" k8s/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "deploy webapp ${{ github.sha }}"
          git pull --rebase
          git push